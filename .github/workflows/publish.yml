name: Publish Marp Presentation

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PRESENTATION_GLOB: "*.marp.md"

jobs:
  build:
    name: Build HTML and PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build presentation
        run: |
          mkdir -p dist
          chmod 777 dist

          mapfile -t presentations < <(find . \
            -path ./dist -prune -o \
            -path ./work -prune -o \
            -path ./.git -prune -o \
            -name "$PRESENTATION_GLOB" \
            -type f \
            -print | sort)

          if [ "${#presentations[@]}" -eq 0 ]; then
            echo "No Marp presentations found matching $PRESENTATION_GLOB"
            exit 1
          fi

          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Brown Bag Presentations</title>
            <style>
              body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 3rem; max-width: 860px; line-height: 1.5; }
              h1 { color: #003e53; }
              li { margin: 0.8rem 0; }
              a { color: #0087a9; font-weight: 650; }
              .pdf { margin-left: 0.75rem; color: #d3002d; }
            </style>
          </head>
          <body>
            <h1>Brown Bag Presentations</h1>
            <ul>
          HTML

          for source in "${presentations[@]}"; do
            source="${source#./}"
            slug="$(basename "$source" .marp.md)"
            html_dir="dist/$slug"
            pdf_dir="dist/pdfs"
            mkdir -p "$html_dir" "$pdf_dir"
            chmod 777 "$html_dir" "$pdf_dir"

            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              marpteam/marp-cli \
              "$source" \
              --html \
              --allow-local-files \
              --output "$html_dir/index.html"

            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              marpteam/marp-cli \
              "$source" \
              --pdf \
              --allow-local-files \
              --output "$pdf_dir/$slug.pdf"

            title="$(grep -m 1 '^# ' "$source" | sed 's/^# //')"
            if [ -z "$title" ]; then
              title="$slug"
            fi

            printf '              <li><a href="%s/">%s</a><a class="pdf" href="pdfs/%s.pdf">PDF</a></li>\n' "$slug" "$title" "$slug" >> dist/index.html
          done

          cat >> dist/index.html <<'HTML'
            </ul>
          </body>
          </html>
          HTML

      - name: Upload PDF build artifact
        uses: actions/upload-artifact@v4
        with:
          name: presentation-pdfs
          path: dist/pdfs/*.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Attach PDF to Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: presentation-pdfs
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.pdf
